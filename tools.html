<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具区 - 语言学大观园</title>
  <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">语</div>
        <span class="logo">语言学大观园</span>
      </div>
      <div class="sidebar-body" id="sidebar-body"></div>
    </aside>
    <div class="overlay" id="overlay"></div>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="toggle-btn" id="sidebar-toggle">☰</button>
          <div class="nav-tabs">
            <a class="nav-tab" href="index.html">学习区</a>
            <a class="nav-tab" href="tools.html">工具区</a>
          </div>
        </div>
        <div class="topbar-right">
          <button class="icon-btn" id="theme-toggle">🌙</button>
        </div>
      </header>

      <main class="content">
        <div class="page-header">
          <h1 class="page-title">🛠️ 工具区 · 大观园</h1>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;">
          <div class="card">
            <h3 style="font-size:16px;margin-bottom:10px;">⏳ 考试倒计时设置</h3>
            <p class="text-secondary text-sm" style="margin-bottom:16px;">设置目标考试日期后,首页倒计时卡片会据此自动计算天数。</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
              <input type="text" class="input" id="exam-name" placeholder="考试名称" style="flex:1;min-width:140px;">
              <input type="date" class="input" id="exam-date" style="flex:1;min-width:150px;">
            </div>
            <button class="btn btn-primary" id="save-exam">保存设置</button>
            <span class="text-secondary text-sm" id="exam-hint" style="margin-left:10px;"></span>
          </div>

          <div class="card">
            <h3 style="font-size:16px;margin-bottom:10px;">📄 数据导出</h3>
            <p class="text-secondary text-sm" style="margin-bottom:16px;">导出你的收藏、笔记、掌握状态等本地数据为 JSON 文件，方便备份。</p>
            <button class="btn btn-primary" id="export-btn">导出全部数据</button>
            <button class="btn btn-secondary" id="import-btn" style="margin-left:8px;">导入数据</button>
            <input type="file" id="import-file" accept=".json" style="display:none;">
          </div>

          <div class="card">
            <h3 style="font-size:16px;margin-bottom:10px;">🗑️ 数据管理</h3>
            <p class="text-secondary text-sm" style="margin-bottom:16px;">清空本地存储的所有数据（收藏、笔记、掌握状态、进度等）。</p>
            <button class="btn btn-secondary" id="clear-btn" style="color:var(--danger);border-color:var(--danger);">清空所有数据</button>
          </div>

          <div class="card">
            <h3 style="font-size:16px;margin-bottom:10px;">💡 关于</h3>
            <p class="text-secondary text-sm" style="margin-bottom:8px;">语言学大观园 - 专为考研语言学设计的刷题工具</p>
            <p class="text-secondary text-sm">所有数据存储在本地浏览器中，不会上传到服务器。</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/storage.js?v=9"></script>
  <script src="js/data-loader.js?v=9"></script>
  <script src="js/main.js?v=9"></script>
  <script>
    // 考试倒计时设置
    const examConfig = Storage.getExamConfig();
    const nameInput = document.getElementById('exam-name');
    const dateInput = document.getElementById('exam-date');
    nameInput.value = examConfig.name || '';
    dateInput.value = examConfig.date || '';

    const refreshExamHint = () => {
      document.getElementById('exam-hint').textContent = `当前:距${Storage.getExamConfig().name}还有 ${Storage.getDaysLeft()} 天`;
    };
    refreshExamHint();

    document.getElementById('save-exam').addEventListener('click', () => {
      const name = nameInput.value.trim() || '考研初试';
      const date = dateInput.value;
      if (!date) { alert('请选择考试日期'); return; }
      Storage.setExamConfig({ name, date });
      refreshExamHint();
      alert('已保存');
    });

    // 数据导出
    document.getElementById('export-btn').addEventListener('click', () => {
      const data = {
        exportedAt: new Date().toISOString(),
        favorites: Storage.getFavorites(),
        mastery: Storage.getMastery(),
        masteryTimes: Storage.get('masteryTimes', {}),
        notes: Storage.getNotes(),
        retest: Storage.getRetestList(),
        progress: Storage.getProgress(),
        userAnswers: Storage.getUserAnswers(),
        dailyActivity: Storage.getDailyActivity(),
        lastChapter: Storage.getLastChapter(),
        examConfig: Storage.getExamConfig(),
        paperHistory: Storage.getPaperHistory(),
        settings: Storage.getSettings()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `语言学大观园备份_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // 数据导入
    document.getElementById('import-btn').addEventListener('click', () => {
      document.getElementById('import-file').click();
    });
    document.getElementById('import-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (data.favorites) Storage.set('favorites', data.favorites);
          if (data.mastery) Storage.set('mastery', data.mastery);
          if (data.masteryTimes) Storage.set('masteryTimes', data.masteryTimes);
          if (data.notes) Storage.set('notes', data.notes);
          if (data.retest) Storage.set('retest', data.retest);
          if (data.progress) Storage.set('progress', data.progress);
          if (data.userAnswers) Storage.set('userAnswers', data.userAnswers);
          if (data.dailyActivity) Storage.set('dailyActivity', data.dailyActivity);
          if (data.lastChapter) Storage.set('lastChapter', data.lastChapter);
          if (data.examConfig) Storage.set('examConfig', data.examConfig);
          if (data.paperHistory) Storage.set('paperHistory', data.paperHistory);
          if (data.settings) Storage.set('settings', data.settings);
          alert('导入成功！');
          location.reload();
        } catch (err) {
          alert('导入失败：文件格式错误');
        }
      };
      reader.readAsText(file);
    });

    // 清空数据
    document.getElementById('clear-btn').addEventListener('click', () => {
      if (confirm('确定要清空所有本地数据吗？此操作不可恢复！')) {
        Object.keys(localStorage).filter(k => k.startsWith(Storage.PREFIX)).forEach(k => localStorage.removeItem(k));
        alert('已清空所有数据');
        location.reload();
      }
    });
  </script>
</body>
</html>
